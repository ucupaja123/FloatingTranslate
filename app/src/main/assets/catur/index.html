<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Catur</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0e1016; color: #f4f5f7; font: 14px/1.4 sans-serif; padding: 16px; max-width: 520px; margin: auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .muted { color: #9aa0ae; }
  textarea, select { width: 100%; background: #1c202b; color: #f4f5f7; border: 1px solid #ffffff2e; border-radius: 14px; padding: 12px; font: inherit; margin-top: 12px; }
  textarea { height: 220px; }
  button { border: 1px solid #ffffff2e; background: #161922; color: #f4f5f7; border-radius: 12px; padding: 12px; font: inherit; }
  button.main { width: 100%; margin-top: 12px; border: 0; background: linear-gradient(135deg, #8b5cf6, #3b82f6); font-weight: bold; }
  #error { color: #f87171; margin-top: 10px; }
  progress { width: 100%; margin-top: 16px; accent-color: #8b5cf6; }
  [hidden] { display: none !important; }
  #evalbar { height: 8px; border-radius: 4px; background: #333844; overflow: hidden; margin: 8px 0; }
  #evalfill { height: 100%; background: #f4f5f7; width: 50%; transition: width .2s; }
  #boardwrap { position: relative; width: 100%; aspect-ratio: 1; }
  #board { display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); width: 100%; height: 100%; border-radius: 8px; overflow: hidden; }
  .sq { display: flex; align-items: center; justify-content: center; font-size: min(10.5vw, 54px); line-height: 1; position: relative; user-select: none; }
  .light { background: #eeeed2; } .dark { background: #769656; }
  .w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; } .b { color: #17181c; }
  .badge { position: absolute; top: 0; right: 0; min-width: 18px; height: 18px; border-radius: 9px; font: bold 11px/18px sans-serif; text-align: center; color: #fff; text-shadow: none; padding: 0 3px; z-index: 2; }
  svg { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
  .nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0; }
  .card { background: #161922; border: 1px solid #ffffff2e; border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  #comment b { font-size: 17px; }
  #moves { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow: auto; }
  #moves button { padding: 6px 9px; font-size: 13px; }
  #moves button.on { border-color: #8b5cf6; background: #2b2347; }
  table { width: 100%; border-collapse: collapse; text-align: center; }
  td, th { padding: 4px; } td:first-child, th:first-child { text-align: left; }
</style>
</head>
<body>
  <section id="input">
    <h1>Review Catur</h1>
    <p class="muted">Tempel PGN game yang sudah selesai.</p>
    <textarea id="pgn" placeholder='1. e4 e5 2. Nf3 ... 1-0' spellcheck="false"></textarea>
    <select id="speed">
      <option value="300">Cepat</option>
      <option value="800" selected>Normal</option>
      <option value="2000">Teliti (lebih lama)</option>
    </select>
    <button class="main" id="go">Analisis</button>
    <p id="error"></p>
    <div id="loading" hidden><progress id="bar" value="0" max="1"></progress><p class="muted" id="count"></p></div>
  </section>

  <section id="result" hidden>
    <p class="muted" id="players"></p>
    <div id="evalbar"><div id="evalfill"></div></div>
    <div id="boardwrap"><div id="board"></div><svg id="arrow" viewBox="0 0 8 8"></svg></div>
    <div class="nav">
      <button data-go="first">⏮</button><button data-go="prev">◀</button><button data-go="next">▶</button>
      <button data-go="last">⏭</button><button data-go="flip">⇅</button>
    </div>
    <div class="card" id="comment"></div>
    <div class="card"><div id="moves"></div></div>
    <div class="card"><table id="summary"></table></div>
    <button class="main" id="again">PGN baru</button>
    <p class="muted">Engine: Stockfish 17.1 (GPLv3). Label dan akurasi memakai aturan sendiri.</p>
  </section>

<script src="rules.js"></script>
<script src="review.js"></script>
<script src="ui.js"></script>
</body>
</html>
