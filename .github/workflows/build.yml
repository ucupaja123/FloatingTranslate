name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl -sSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_DIR"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Download Stockfish (engine catur)
        run: |
          set -euo pipefail
          fetch() {
            arch="$1"; abi="$2"; sum="$3"
            curl -sSfL -o "$RUNNER_TEMP/$arch.tar" \
              "https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-$arch.tar"
            echo "$sum  $RUNNER_TEMP/$arch.tar" | sha256sum -c -
            mkdir -p "app/src/main/jniLibs/$abi"
            tar -xOf "$RUNNER_TEMP/$arch.tar" "stockfish/stockfish-android-$arch" > "app/src/main/jniLibs/$abi/libstockfish.so"
          }
          fetch armv8 arm64-v8a 634d8e7af7f776e641d909b49fa52e7f88e8ec3f18c0535ee63d564bf246ebcd
          fetch armv7 armeabi-v7a f3234c85f07aa44453a17d53b1f5c8b964e52c1f37e37469440ed6fcef4daf04

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-translate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
